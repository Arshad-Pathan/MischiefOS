<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Timezone Clock</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: Arial, sans-serif;
    }

    .clock-container {
      position: relative;
      width: 400px;
      height: 400px;
    }

    .clock {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #f5f5f5);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.1);
      position: relative;
      border: 8px solid #333;
    }

    /* Clock numbers */
    .clock-number {
      position: absolute;
      width: 100%;
      height: 100%;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }

    .clock-number span {
      display: inline-block;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .clock-number span:nth-child(1) { top: 20px; }
    .clock-number span:nth-child(2) { top: 60px; right: 40px; }
    .clock-number span:nth-child(3) { right: 20px; top: 50%; transform: translate(0, -50%); }
    .clock-number span:nth-child(4) { bottom: 60px; right: 40px; }
    .clock-number span:nth-child(5) { bottom: 20px; }
    .clock-number span:nth-child(6) { bottom: 60px; left: 40px; }
    .clock-number span:nth-child(7) { left: 20px; top: 50%; transform: translate(0, -50%); }
    .clock-number span:nth-child(8) { top: 60px; left: 40px; }

    .center-dot {
      width: 16px;
      height: 16px;
      background: #333;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
    }

    /* Hand styles */
    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 10px;
    }

    .hand.hours {
      width: 8px;
      height: 80px;
      margin-left: -4px;
      z-index: 4;
    }

    .hand.minutes {
      width: 6px;
      height: 110px;
      margin-left: -3px;
      z-index: 5;
    }

    .hand.seconds {
      width: 3px;
      height: 130px;
      margin-left: -1.5px;
      z-index: 6;
    }

    /* Timezone 1: UTC/London - Red/Blue */
    .tz-1.hours { background: #2c3e50; }
    .tz-1.minutes { background: #3498db; }
    .tz-1.seconds { background: #e74c3c; }

    /* Timezone 2: IST/India - Green/Purple */
    .tz-2.hours { background: #27ae60; }
    .tz-2.minutes { background: #9b59b6; }
    .tz-2.seconds { background: #f39c12; }

    /* Timezone 3: PST/Los Angeles - Dark/Orange */
    .tz-3.hours { background: #34495e; }
    .tz-3.minutes { background: #e67e22; }
    .tz-3.seconds { background: #1abc9c; }

    .legend {
      position: absolute;
      bottom: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
      color: white;
      font-size: 12px;
    }

    .legend-item {
      display: inline-block;
      margin: 10px 15px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      backdrop-filter: blur(10px);
    }

    .legend-color {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }

    .time-info {
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
      color: white;
    }

    .time-info div {
      display: inline-block;
      margin: 0 20px;
      font-size: 14px;
      min-width: 120px;
    }

    .time-info .label {
      font-size: 12px;
      opacity: 0.8;
    }

    .time-info .time {
      font-size: 16px;
      font-weight: bold;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="clock-container">
    <div class="time-info">
      <div>
        <div class="label">UTC (London)</div>
        <div class="time" id="time-1"></div>
      </div>
      <div>
        <div class="label">IST (India)</div>
        <div class="time" id="time-2"></div>
      </div>
      <div>
        <div class="label">PST (LA)</div>
        <div class="time" id="time-3"></div>
      </div>
    </div>

    <div class="clock">
      <div class="clock-number">
        <span>12</span>
        <span>1</span>
        <span>3</span>
        <span>2</span>
        <span>6</span>
        <span>9</span>
        <span>9</span>
        <span>11</span>
      </div>

      <!-- Timezone 1: UTC -->
      <div class="hand hours tz-1" id="hours-1"></div>
      <div class="hand minutes tz-1" id="minutes-1"></div>
      <div class="hand seconds tz-1" id="seconds-1"></div>

      <!-- Timezone 2: IST -->
      <div class="hand hours tz-2" id="hours-2"></div>
      <div class="hand minutes tz-2" id="minutes-2"></div>
      <div class="hand seconds tz-2" id="seconds-2"></div>

      <!-- Timezone 3: PST -->
      <div class="hand hours tz-3" id="hours-3"></div>
      <div class="hand minutes tz-3" id="minutes-3"></div>
      <div class="hand seconds tz-3" id="seconds-3"></div>

      <div class="center-dot"></div>
    </div>

    <div class="legend">
      <div class="legend-item">
        <span class="legend-color" style="background: #2c3e50;"></span> UTC Hours
      </div>
      <div class="legend-item">
        <span class="legend-color" style="background: #3498db;"></span> UTC Minutes
      </div>
      <div class="legend-item">
        <span class="legend-color" style="background: #e74c3c;"></span> UTC Seconds
      </div>
      <div style="margin-top: 8px; display: block;">
        <div class="legend-item">
          <span class="legend-color" style="background: #27ae60;"></span> IST Hours
        </div>
        <div class="legend-item">
          <span class="legend-color" style="background: #9b59b6;"></span> IST Minutes
        </div>
        <div class="legend-item">
          <span class="legend-color" style="background: #f39c12;"></span> IST Seconds
        </div>
        <div class="legend-item">
          <span class="legend-color" style="background: #34495e;"></span> PST Hours
        </div>
        <div class="legend-item">
          <span class="legend-color" style="background: #e67e22;"></span> PST Minutes
        </div>
        <div class="legend-item">
          <span class="legend-color" style="background: #1abc9c;"></span> PST Seconds
        </div>
      </div>
    </div>
  </div>

  <script>
    const timezones = [
      { id: 1, timezone: 'Europe/London', label: 'UTC' },
      { id: 2, timezone: 'Asia/Kolkata', label: 'IST' },
      { id: 3, timezone: 'America/Los_Angeles', label: 'PST' }
    ];

    function updateClock(timezoneData) {
      const { id, timezone } = timezoneData;

      // Get time in specific timezone
      const date = new Date().toLocaleString(undefined, { timeZone: timezone });
      const localDate = new Date(date);

      const seconds = localDate.getSeconds();
      const minutes = localDate.getMinutes();
      const hours = localDate.getHours();

      // Calculate positions
      const secPosition = seconds * 6; // 360 / 60
      const minPosition = minutes * 6; // 360 / 60
      const hourPosition = (hours % 12) * 30 + minutes * 0.5; // 360 / 12 + smooth transition

      // Get hand elements
      const secondsHand = document.querySelector(`#seconds-${id}`);
      const minutesHand = document.querySelector(`#minutes-${id}`);
      const hoursHand = document.querySelector(`#hours-${id}`);
      const timeDisplay = document.querySelector(`#time-${id}`);

      // Remove transition at exactly 0 position for smooth rotation
      if (secPosition === 0) {
        secondsHand.style.transition = 'none';
      } else {
        secondsHand.style.transition = '0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
      }
      if (minPosition === 0) {
        minutesHand.style.transition = 'none';
      } else {
        minutesHand.style.transition = '0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
      }
      if (hourPosition === 0) {
        hoursHand.style.transition = 'none';
      } else {
        hoursHand.style.transition = '0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
      }

      // Apply rotation
      secondsHand.style.transform = `rotate(${secPosition}deg)`;
      minutesHand.style.transform = `rotate(${minPosition}deg)`;
      hoursHand.style.transform = `rotate(${hourPosition}deg)`;

      // Display time
      const timeString = localDate.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
      });
      timeDisplay.textContent = timeString;
    }

    // Update all clocks every second
    setInterval(() => {
      timezones.forEach(updateClock);
    }, 1000);

    // Initial update
    timezones.forEach(updateClock);
  </script>
</body>
</html>
