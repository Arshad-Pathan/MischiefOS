<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MischiefOS</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Space+Grotesk:wght@300..700&display=swap"
            rel="stylesheet">
    </head>

    <body>
        <div class="nav" id="top">
            <h4>ARSHAD PATHAN</h4>
            <p id="timeElement"></p>
        </div>
        <div class="icons_bar">
          <div class="icon" id="introopen">
              <div>
                  <img src="images/handbook.png" alt="journal icon">
              </div>
          </div>
          
          <div class="icon" id="journalopen">
              <div>
                  <img src="images/handbook.png" alt="journal icon">
              </div>
          </div>
        </div>
        
        
        <!-- intro window -->
        <div class="window intro" id="intro">
            <div class="windowheader" id="introheader">
              <div class="window_icons">
                <div class="window_icon" id="introclose" style="background-color: #ff0000;"></div>
                <div class="window_icon" id="" style="background-color: #faf500;"></div>
                <div class="window_icon" id="" style="background-color: #45ff11;"></div>
                <p>INTRO</p>
              </div>
            </div>
            <div class="intro_content">
                <img src="images/image.png" alt="My image">
                <h1>MischiefOS</h1>
                <p>MischiefOS is a themed OS Inspired by Loki
                    Series Retro Futurism and the main characters
                    charatacterisc.</p>
            </div>
        
        </div>
        
        <!-- Journal window -->
        <div class="window journal" id="journal">
            
            <div class="windowheader" id="journalheader">
                <div class="window_icons">
                    <div class="window_icon" id="journalclose" style="background-color: #ff0000;"></div>
                    <div class="window_icon" id="journalclose" style="background-color: #faf500;"></div>
                    <div class="window_icon" id="journalclose" style="background-color: #45ff11;"></div>
                    <p>JOURNAL</p>
                </div>

                <div class="journal_icons">
                  <div class="save_btn" id="saveBtn">SAVE</div>
                  <div class="edit_icon" id="editBtn"></div>
                </div>
            </div>
            <div class="journal_book" id="j_content">
                <img src="images/page.png" alt="">
                
                <div class="journal_content">
                    <div class="part" id="leftTADiv">
                        <!-- Lorem ipsum dolor, sit amet consectetur adipisicing elit. Laborum voluptates doloribus odit sint autem, ipsum rem hic saepe voluptate sed porro quisquam, amet, dolor ipsam nesciunt! Laborum labore odit doloribus.
                        Corporis placeat exercitationem perferendis soluta saepe provident, temporibus fugiat dolor illum tempora esse, deserunt illo commodi optio natus aut recusandae officiis ducimus animi vel et, deleniti vitae rem voluptatum? Est?
                        <textarea name="journalmd" class="md_content" id="mdContent" rows=32 placeholder="#Enter Date - then Your Name and then start writing your thoughts"></textarea>-->
                    </div>
                    <div class="part" id="rightTADiv">
                        <!-- Lorem ipsum dolor, sit amet consectetur adipisicing elit. Laborum voluptates doloribus odit sint autem, ipsum rem hic saepe voluptate sed porro quisquam, amet, dolor ipsam nesciunt! Laborum labore odit doloribus.

                    </div>
                </div>
                <div class="pagination">
                    <button id="prev"></button>
                    <button id="pNumber"></button>
                    <button id="next"></button>
                </div>

            </div>
        </div>
        
        <!--
            > starting featues entry message, after ok the window become full window
            > apps are accessible in the app menu
            > window open, minimize and close transitions 
        -->
        <script src="script.js"></script>
    </body>

</html>
