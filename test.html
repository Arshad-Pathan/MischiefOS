<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Countdown Timer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .timer-container {
            text-align: center;
            background-color: #262626;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .timer {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 3.5rem;
            font-weight: bold;
            margin: 20px 0;
        }
        .time-box {
            background-color: #333;
            padding: 10px 20px;
            border-radius: 8px;
            min-width: 90px;
        }
        .label {
            font-size: 0.8rem;
            display: block;
            color: #aaa;
            text-transform: uppercase;
            margin-top: 5px;
        }
        .preset-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            background-color: #444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #00adb5;
        }
        .custom-input-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
        }
        input[type="number"] {
            width: 60px;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #333;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="timer-container">
        <!-- Preset Options -->
        <div class="preset-buttons">
            <button onclick="startPresetTimer(1)">1 Min</button>
            <button onclick="startPresetTimer(5)">5 Min</button>
            <button onclick="startPresetTimer(15)">15 Min</button>
            <button onclick="startPresetTimer(30)">30 Min</button>
            <button onclick="startPresetTimer(60)">60 Min</button>
        </div>

        <!-- The Display -->
        <div class="timer">
            <div class="time-box">
                <span id="minutes">00</span>
                <span class="label">Minutes</span>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <span class="label">Seconds</span>
            </div>
        </div>

        <!-- Custom Input Layout -->
        <div class="custom-input-group">
            <input type="number" id="customMin" placeholder="Min" min="0" max="999">
            <span>:</span>
            <input type="number" id="customSec" placeholder="Sec" min="0" max="59">
            <button onclick="startCustomTimer()">Set Custom</button>
        </div>
    </div>

    <script>
        let countdownInterval;
        let timeRemaining = 0; // Total time left in seconds

        // Core execution loop
        function runTimer() {
            // Clear any previously running intervals
            clearInterval(countdownInterval);

            // Update display immediately before waiting for the first interval tick
            updateDisplay();

            countdownInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(countdownInterval);
                    alert("Time is up!");
                    return;
                }
                
                timeRemaining--;
                updateDisplay();
            }, 1000);
        }

        // Format and push values to HTML
        function updateDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;

            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }

        // Action when a preset button is clicked
        function startPresetTimer(minutes) {
            timeRemaining = minutes * 60;
            runTimer();
        }

        // Action when the custom button is clicked
        function startCustomTimer() {
            const minInput = parseInt(document.getElementById("customMin").value) || 0;
            const secInput = parseInt(document.getElementById("customSec").value) || 0;

            // Combine inputs into total seconds
            timeRemaining = (minInput * 60) + secInput;

            if (timeRemaining <= 0) {
                alert("Please enter a valid time duration.");
                return;
            }

            runTimer();
        }
    </script>

</body>
</html>
