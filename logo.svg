<svg width="1536" height="864" viewBox="0 0 1536 864"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Amber glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Fine dotted matrix -->
    <pattern id="dots"
             width="28"
             height="28"
             patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#FF8A18"/>
    </pattern>

    <!-- Diagonal slash pattern -->
    <pattern id="slashes"
             width="42"
             height="42"
             patternUnits="userSpaceOnUse">
      <path d="M8 32 L25 8"
            fill="none"
            stroke="#FF8A18"
            stroke-width="5"
            stroke-linecap="square"/>
    </pattern>

  </defs>


  <!-- ========================================================= -->
  <!-- BACKGROUND -->
  <!-- ========================================================= -->

  <rect width="1536" height="864" fill="#050403"/>


  <!-- ========================================================= -->
  <!-- OUTER FRAME GLOW -->
  <!-- ========================================================= -->

  <path
    d="
      M82 112
      H1458
      V126
      H1472
      V778
      H1458
      V792
      H82
      V778
      H68
      V126
      H82
      Z
    "
    fill="none"
    stroke="#FF8A18"
    stroke-width="3"
    opacity="0.55"
    filter="url(#glow)"
  />


  <!-- ========================================================= -->
  <!-- OUTER PIXEL FRAME -->
  <!-- ========================================================= -->

  <path
    d="
      M82 112
      H1458
      V126
      H1472
      V778
      H1458
      V792
      H82
      V778
      H68
      V126
      H82
      Z
    "
    fill="none"
    stroke="#FF8A18"
    stroke-width="4"
    stroke-linejoin="miter"
  />


  <!-- ========================================================= -->
  <!-- TOP SLASH AREA -->
  <!-- ========================================================= -->

  <rect
    x="112"
    y="140"
    width="1312"
    height="82"
    fill="url(#slashes)"
    opacity="0.95"
  />


  <!-- ========================================================= -->
  <!-- HEADER / TITLE BOX -->
  <!-- ========================================================= -->

  <!-- subtle glow -->
  <rect
    x="126"
    y="224"
    width="1284"
    height="122"
    fill="none"
    stroke="#FF8A18"
    stroke-width="8"
    opacity="0.4"
    filter="url(#glow)"
  />

  <!-- main pixel-like frame -->
  <rect
    x="126"
    y="224"
    width="1284"
    height="122"
    fill="none"
    stroke="#FF8A18"
    stroke-width="6"
    stroke-linejoin="miter"
  />


  <!-- ========================================================= -->
  <!-- LOWER DOT MATRIX PANEL -->
  <!-- ========================================================= -->

  <rect
    x="108"
    y="374"
    width="1320"
    height="384"
    fill="url(#dots)"
    opacity="0.75"
  />


  <!-- ========================================================= -->
  <!-- SUBTLE INNER AMBER FRAME -->
  <!-- ========================================================= -->

  <path
    d="
      M108 374
      H1428
      M108 758
      H1428
    "
    stroke="#FF8A18"
    stroke-width="2"
    opacity="0.12"
  />


  <!-- ========================================================= -->
  <!-- PIXEL ACCENT CORNERS -->
  <!-- ========================================================= -->

  <g fill="#FF8A18">

    <!-- top-left -->
    <rect x="68" y="126" width="14" height="14"/>
    <rect x="82" y="112" width="14" height="14"/>

    <!-- top-right -->
    <rect x="1458" y="126" width="14" height="14"/>
    <rect x="1444" y="112" width="14" height="14"/>

    <!-- bottom-left -->
    <rect x="68" y="764" width="14" height="14"/>
    <rect x="82" y="778" width="14" height="14"/>

    <!-- bottom-right -->
    <rect x="1458" y="764" width="14" height="14"/>
    <rect x="1444" y="778" width="14" height="14"/>

  </g>


  <!-- ========================================================= -->
  <!-- OPTIONAL PIXEL GRAIN / SCANLINE EFFECT -->
  <!-- ========================================================= -->

  <g opacity="0.08">
    <path
      d="M0 8 H1536 M0 24 H1536 M0 40 H1536 M0 56 H1536
         M0 72 H1536 M0 88 H1536 M0 104 H1536
         M0 120 H1536 M0 136 H1536 M0 152 H1536
         M0 168 H1536 M0 184 H1536 M0 200 H1536
         M0 216 H1536 M0 232 H1536 M0 248 H1536
         M0 264 H1536 M0 280 H1536 M0 296 H1536
         M0 312 H1536 M0 328 H1536 M0 344 H1536
         M0 360 H1536 M0 376 H1536 M0 392 H1536
         M0 408 H1536 M0 424 H1536 M0 440 H1536
         M0 456 H1536 M0 472 H1536 M0 488 H1536
         M0 504 H1536 M0 520 H1536 M0 536 H1536
         M0 552 H1536 M0 568 H1536 M0 584 H1536
         M0 600 H1536 M0 616 H1536 M0 632 H1536
         M0 648 H1536 M0 664 H1536 M0 680 H1536
         M0 696 H1536 M0 712 H1536 M0 728 H1536
         M0 744 H1536 M0 760 H1536 M0 776 H1536
         M0 792 H1536 M0 808 H1536 M0 824 H1536
         M0 840 H1536"
      stroke="#FF8A18"
      stroke-width="1"
    />
  </g>

</svg>